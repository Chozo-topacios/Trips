<title>Planificador de viaje</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna tipo "hoja de ruta"; las paradas se dibujan como una carretera vertical con hitos de km. Señalética vial: verde de autopista + ámbar. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #18231e;
  --muted: #5b6a62;
  --line: #d9e0db;
  --road: #13664f;
  --road-ink: #ffffff;
  --amber: #b86e0b;
  --soft: #e5efe9;
  --danger: #a2321f;
  --asphalt: #3a4540;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101613; --surface: #17201c; --ink: #e5ece7; --muted: #9aaba2; --line: #2a3832;
    --road: #3fb58f; --road-ink: #06231a; --amber: #e6a145; --soft: #1d2d26; --danger: #f08a75; --asphalt: #4b5a53;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101613; --surface: #17201c; --ink: #e5ece7; --muted: #9aaba2; --line: #2a3832;
  --road: #3fb58f; --road-ink: #06231a; --amber: #e6a145; --soft: #1d2d26; --danger: #f08a75; --asphalt: #4b5a53;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, .sign, .q { font-family: var(--f-display); text-wrap: balance; }
h1 { margin: 8px 0 0; font-size: 34px; line-height: 1.05; }
h2 { margin: 0; font-size: 22px; font-weight: 600; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.sign {
  display: inline-flex; background: var(--road); color: var(--road-ink); border-radius: 6px; padding: 3px 10px;
  font-weight: 600; font-size: 13px; letter-spacing: .8px; text-transform: uppercase;
  border: 2px solid var(--road-ink); outline: 2px solid var(--road);
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode {
  font: inherit; font-family: var(--f-display); font-size: 20px; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 12px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.mode[aria-pressed="true"] { border-color: var(--road); background: var(--soft); }
.big { display: flex; flex-direction: column; gap: 6px; }
.big label { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.big input { font-size: 20px; padding: 12px 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
label.sm { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
:focus-visible { outline: 2px solid var(--road); outline-offset: 2px; }
details summary { cursor: pointer; font-size: 14px; color: var(--muted); }
details[open] summary { margin-bottom: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 600; border-radius: 8px; padding: 11px 18px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--ink); border: 1px solid var(--line);
}
.btn.primary { background: var(--road); color: var(--road-ink); border-color: var(--road); font-size: 16px; }
.btn.primary:disabled { opacity: .55; cursor: wait; }
.btn.link { border-color: var(--road); color: var(--road); }
.err { color: var(--danger); font-size: 14px; margin: 0; }
.status { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--road); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
.notice { font-size: 13px; color: var(--muted); border-left: 3px solid var(--amber); padding: 2px 10px; margin: 0; }

/* Resumen */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { background: var(--soft); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.stats b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats span { font-size: 12px; color: var(--muted); }

/* Carretera de paradas */
.route { list-style: none; margin: 0; padding: 0; position: relative; }
#head, #body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.route::before { content: ""; position: absolute; left: 55px; top: 8px; bottom: 8px; width: 6px; background: var(--asphalt); border-radius: 3px; }
.route::after { content: ""; position: absolute; left: 57.5px; top: 8px; bottom: 8px; width: 1px; background: repeating-linear-gradient(var(--bg) 0 8px, transparent 8px 16px); }
.stop { position: relative; display: grid; grid-template-columns: 38px 24px 1fr; gap: 10px; padding: 8px 0; align-items: start; }
.km { font-family: var(--f-display); font-weight: 600; font-size: 14px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 4px solid var(--road); margin-top: 3px; position: relative; z-index: 1; }
.stop.end .dot { background: var(--road); }
.stop.must .dot { border-color: var(--amber); }
.card { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card h3 { margin: 0; font-size: 19px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-family: var(--f-body); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--road); }
.tag.must { background: var(--amber); color: var(--surface); }
.card p { margin: 0; }
.card .meta { font-size: 13px; color: var(--muted); }
.card a { font-size: 13px; color: var(--road); font-weight: 600; }
.card label.pick { flex-direction: row; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.card label.pick input { width: auto; }
ul.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

/* Avión */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border-radius: 999px; padding: 5px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--road); color: var(--road-ink); border-color: var(--road); }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.site { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--bg); }
.site h3 { margin: 0; font-size: 18px; font-weight: 600; }
.site p { margin: 0; font-size: 14px; }
.site .meta { font-size: 12px; color: var(--muted); }
.site a { font-size: 13px; color: var(--road); font-weight: 600; margin-top: auto; }

/* Chat */
.thread { display: flex; flex-direction: column; gap: 12px; }
.you { align-self: flex-end; background: var(--road); color: var(--road-ink); border-radius: 12px 12px 2px 12px; padding: 8px 12px; max-width: 85%; white-space: pre-wrap; }
.md { min-width: 0; overflow-wrap: anywhere; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; }
.md h3, .md h4 { font-family: var(--f-display); margin: 10px 0 4px; }
.ask { display: flex; gap: 8px; }
.ask textarea { resize: vertical; min-height: 44px; }
@media (max-width: 480px) { h1 { font-size: 28px; } .ask { flex-direction: column; } }
</style>

<div class="wrap">
  <header>
    <span class="sign">Carro · Avión</span>
    <h1>Planificador de viaje</h1>
    <p class="lead">Dime hasta dónde vas. En carro te sugiero las paradas que valen la pena en el camino; en avión, el presupuesto y todos los sitios para visitar.</p>
  </header>

  <section class="panel">
    <div class="modes" role="group" aria-label="Tipo de viaje">
      <button class="mode" id="m-carro" type="button" aria-pressed="true">🚗 Carro</button>
      <button class="mode" id="m-avion" type="button" aria-pressed="false">✈️ Avión</button>
    </div>

    <div class="big">
      <label for="destino" id="destino-lbl">¿Hasta dónde vas?</label>
      <input id="destino" placeholder="Ej. Salento, Villa de Leyva, Cartagena…" autocomplete="off" enterkeyhint="go">
    </div>

    <details id="mas">
      <summary>Más detalles (opcional)</summary>
      <div class="row">
        <label class="sm">Salgo desde<input id="origen" value="Bogotá"></label>
        <label class="sm">Días<input id="dias" type="number" min="1" placeholder="—"></label>
        <label class="sm">Viajeros<input id="viajeros" type="number" min="1" value="2"></label>
        <label class="sm">Gustos<input id="gustos" placeholder="pueblos, comida, naturaleza…"></label>
      </div>
    </details>

    <div class="actions">
      <button class="btn primary" id="go" type="button">Sugerir paradas</button>
      <button class="btn" id="stop" type="button" hidden>Detener</button>
    </div>
    <p class="err" id="err" hidden></p>
  </section>

  <!-- Ejemplo visible antes de la primera búsqueda -->
  <section class="panel" id="out" aria-live="polite">
    <div id="head"></div>
    <div id="body"></div>
  </section>

  <section class="panel" id="chat" hidden>
    <h2>¿Algo más?</h2>
    <div class="thread" id="thread"></div>
    <div class="ask">
      <textarea id="followup" placeholder="Ej. ‘¿dónde almuerzo?’, ‘quiero ir por otra vía’, ‘agrega una noche más’"></textarea>
      <button class="btn primary" id="send" type="button">Preguntar</button>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let mode = "carro", sample = null, ctl = null, last = null, turns = [];

  try { const o = localStorage.getItem("ruta.origen"); if (o) $("origen").value = o; } catch {}

  function setMode(m) {
    mode = m;
    $("m-carro").setAttribute("aria-pressed", String(m === "carro"));
    $("m-avion").setAttribute("aria-pressed", String(m === "avion"));
    $("destino-lbl").textContent = m === "carro" ? "¿Hasta dónde vas?" : "¿A dónde viajas?";
    $("go").textContent = m === "carro" ? "Sugerir paradas" : "Ver presupuesto y sitios";
  }
  $("m-carro").onclick = () => setMode("carro");
  $("m-avion").onclick = () => setMode("avion");

  const mapsSearch = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const mapsRoute = (o, d, w) => {
    const p = new URLSearchParams({ api: "1", origin: o, destination: d, travelmode: "driving" });
    if (w.length) p.set("waypoints", w.slice(0, 9).join("|"));
    return "https://www.google.com/maps/dir/?" + p.toString();
  };
  const money = (n, cur) => (typeof n === "number" && isFinite(n)) ? `${cur === "USD" ? "US$" : "$"}${Math.round(n).toLocaleString("es-CO")}` : (n ?? "—");

  // ---------- Prompts ----------
  const hoy = () => new Date().toISOString().slice(0, 10);
  function carPrompt(o, d, dias, viaj, gustos) {
    return `Eres un experto en viajes por carretera (especialmente en Colombia). Fecha de hoy: ${hoy()}.
Viaje en carro de "${o}" a "${d}". ${dias ? `Duración: ${dias} días.` : ""} Viajeros: ${viaj}. ${gustos ? `Gustos: ${gustos}.` : ""}
El carro es una Chery iCAR 03T de RANGO EXTENDIDO (motor eléctrico con batería + generador a gasolina): NO necesita parar a cargar, puede seguir con gasolina. Las paradas son por turismo, comida y descanso, no por carga.

Sugiere la ruta más recomendada y las paradas que realmente valen la pena en el camino (pueblos, miradores, gastronomía típica, naturaleza, sitios históricos), en orden desde el origen, con su km aproximado. Entre 4 y 9 paradas según la distancia, sin desviarse más de ~30 min de la ruta salvo que valga mucho la pena (dilo). Incluye al menos una buena opción para almorzar. Si el trayecto es de más de 7 h, sugiere dónde dormir. No inventes lugares: usa solo sitios reales y conocidos.

Responde SOLO con un objeto JSON con esta forma:
{"via":"vía principal, ej. Autopista Medellín – Bogotá por Honda","distancia_km":415,"tiempo_conduccion":"8 h 30 min","peajes":{"cantidad":6,"total_aprox_cop":120000,"nota":"tarifas aprox. automóvil categoría I"},"paradas":[{"nombre":"Guaduas","municipio":"Guaduas, Cundinamarca","km":120,"tipo":"pueblo","por_que":"1 frase concreta de por qué parar","que_hacer":"qué ver o comer","tiempo_sugerido":"45 min","imperdible":true,"desvio":"sobre la vía"}],"dormir":"null o dónde pasar la noche y por qué","energia":["3 o 4 consejos breves para manejar batería y gasolina en ESTA ruta (salir con batería al 100% y tanque lleno, usar modo eléctrico en ciudad y bajadas, modo de conservar batería antes de subidas largas, cargar en el hotel si hay toma)"],"consejos_via":["2 o 3 consejos de la vía: estado, obras, horas de tráfico, clima"]}
"tipo" es uno de: pueblo, mirador, comida, naturaleza, historia, descanso. Las cifras son aproximadas.`;
  }
  function airPrompt(o, d, dias, viaj, gustos) {
    return `Eres un experto en viajes. Fecha de hoy: ${hoy()}.
Viaje en avión${o ? ` desde "${o}"` : ""} a "${d}". Días: ${dias || "4 (asúmelo y dilo)"}. Viajeros: ${viaj}. ${gustos ? `Gustos: ${gustos}.` : ""}
Arma un presupuesto completo para todo el grupo y una lista de TODOS los sitios turísticos que valen la pena (entre 12 y 20), del más imperdible al menos. Usa la moneda del lugar de origen si es Colombia (COP); si no, USD. No inventes lugares.

Responde SOLO con un objeto JSON con esta forma:
{"moneda":"COP","dias":4,"presupuesto":[{"concepto":"Vuelos ida y vuelta","detalle":"tarifa promedio en temporada media","total":1200000}],"total":5000000,"por_persona":2500000,"nota_presupuesto":"qué incluye y cómo ahorrar","sitios":[{"nombre":"Ciudad Amurallada","zona":"Centro","categoria":"historia","por_que":"1 frase concreta","tiempo":"medio día","costo":"gratis o precio aprox. por persona","imperdible":true}],"donde_dormir":[{"zona":"Getsemaní","por_que":"ambiente, precio","rango_noche":"$200.000–$400.000"}],"movilidad":["3 o 4 consejos: desde el aeropuerto, apps, transporte, seguridad"]}
"categoria" es una de: historia, naturaleza, playa, cultura, comida, vida nocturna, compras, aventura. El presupuesto debe incluir vuelos, hospedaje, comidas, transporte local, entradas/tours y un imprevisto. Cifras aproximadas.`;
  }

  // ---------- Render carro ----------
  function renderCar(r, o, d) {
    const head = $("head"), body = $("body");
    head.replaceChildren(); body.replaceChildren();
    const h = el("h2", null, `${o} → ${d}`);
    const via = el("p", "lead", r.via ? `Por ${r.via}` : "");
    const stats = el("div", "stats");
    [[r.distancia_km ? `${r.distancia_km} km` : "—", "distancia"], [r.tiempo_conduccion || "—", "manejando, sin paradas"],
     [String(r.paradas?.length ?? 0), "paradas sugeridas"],
     [r.peajes?.total_aprox_cop ? money(r.peajes.total_aprox_cop) : "—", `${r.peajes?.cantidad ?? "?"} peajes, solo ida (aprox.)`]]
      .forEach(([b, s]) => { const c = el("div"); c.append(el("b", null, b), el("span", null, s)); stats.append(c); });
    head.append(h, via, stats);

    const ol = el("ol", "route");
    const mkStop = (km, cls, inner) => { const li = el("li", "stop " + cls); li.append(el("span", "km", km), el("span", "dot"), inner); ol.append(li); };
    const start = el("div", "card"); start.append(el("h3", null, o)); start.append(el("p", "meta", "Salida: batería al 100 % y tanque lleno."));
    mkStop("0", "end", start);
    const paradas = Array.isArray(r.paradas) ? r.paradas : [];
    paradas.forEach((p, i) => {
      const c = el("div", "card");
      const t = el("h3", null, p.nombre || "Parada");
      if (p.imperdible) t.append(el("span", "tag must", "Imperdible"));
      if (p.tipo) t.append(el("span", "tag", p.tipo));
      c.append(t);
      if (p.por_que) c.append(el("p", null, p.por_que));
      if (p.que_hacer) c.append(el("p", "meta", "👉 " + p.que_hacer));
      c.append(el("p", "meta", [p.tiempo_sugerido && `⏱ ${p.tiempo_sugerido}`, p.desvio && `↪ ${p.desvio}`].filter(Boolean).join(" · ")));
      const a = el("a", null, "Ver en Google Maps"); a.href = mapsSearch(`${p.nombre}, ${p.municipio || ""}`); a.target = "_blank"; a.rel = "noopener";
      const pick = el("label", "pick"); const cb = el("input"); cb.type = "checkbox"; cb.checked = true; cb.dataset.i = i; cb.id = "pick-" + i;
      cb.onchange = updateRouteLink; pick.append(cb, document.createTextNode("Incluir en la ruta"));
      const row = el("div", "actions"); row.style.gap = "14px"; row.append(a, pick); c.append(row);
      mkStop(p.km != null ? String(Math.round(p.km)) : "·", p.imperdible ? "must" : "", c);
    });
    const end = el("div", "card"); end.append(el("h3", null, d));
    if (r.dormir && r.dormir !== "null") end.append(el("p", "meta", "🛏 " + r.dormir));
    mkStop(r.distancia_km ? String(r.distancia_km) : "", "end", end);
    body.append(ol);

    const act = el("div", "actions");
    const route = el("a", "btn link", "🗺️ Abrir ruta con paradas en Google Maps"); route.id = "route-link"; route.target = "_blank"; route.rel = "noopener";
    act.append(route); body.append(act);
    function updateRouteLink() {
      const w = [...body.querySelectorAll("input[type=checkbox]")].filter((x) => x.checked).map((x) => { const p = paradas[+x.dataset.i]; return `${p.nombre}, ${p.municipio || ""}`; });
      route.href = mapsRoute(o, d, w);
    }
    updateRouteLink();

    const sec = (title, items) => {
      if (!Array.isArray(items) || !items.length) return;
      body.append(el("h2", null, title)); const ul = el("ul", "tips"); items.forEach((t) => ul.append(el("li", null, String(t)))); body.append(ul);
    };
    sec("🔋⛽ Batería y gasolina", r.energia);
    sec("🛣️ Sobre la vía", r.consejos_via);
    body.append(el("p", "notice", (r.peajes?.nota ? r.peajes.nota + ". " : "") + "Sugerencias de Claude sin consulta en vivo: confirma horarios, precios y estado de la vía antes de salir."));
  }

  // ---------- Render avión ----------
  function renderAir(r, d) {
    const head = $("head"), body = $("body");
    head.replaceChildren(); body.replaceChildren();
    const cur = r.moneda || "COP";
    head.append(el("h2", null, `✈️ ${d}`));
    const stats = el("div", "stats");
    [[money(r.total, cur), `total ${cur} (aprox.)`], [money(r.por_persona, cur), "por persona"], [`${r.dias ?? "—"} días`, "duración"], [String(r.sitios?.length ?? 0), "sitios para visitar"]]
      .forEach(([b, s]) => { const c = el("div"); c.append(el("b", null, b), el("span", null, s)); stats.append(c); });
    head.append(stats);

    body.append(el("h2", null, "Presupuesto"));
    const wrap = el("div", "tbl"), t = el("table");
    const thead = el("thead"); const hr = el("tr"); hr.append(el("th", null, "Concepto"), el("th", null, "Detalle"), el("th", "n", "Total")); thead.append(hr);
    const tb = el("tbody");
    (r.presupuesto || []).forEach((x) => { const tr = el("tr"); tr.append(el("td", null, x.concepto), el("td", null, x.detalle || ""), el("td", "n", money(x.total, cur))); tb.append(tr); });
    const tot = el("tr", "total"); tot.append(el("td", null, "Total"), el("td", null, ""), el("td", "n", money(r.total, cur))); tb.append(tot);
    t.append(thead, tb); wrap.append(t); body.append(wrap);
    if (r.nota_presupuesto) body.append(el("p", "notice", r.nota_presupuesto));

    body.append(el("h2", null, "Sitios turísticos"));
    const sitios = Array.isArray(r.sitios) ? r.sitios : [];
    const cats = [...new Set(sitios.map((s) => s.categoria).filter(Boolean))];
    const filters = el("div", "filters"); const grid = el("div", "sites");
    let current = "todos";
    const draw = () => {
      grid.replaceChildren();
      sitios.filter((s) => current === "todos" || (current === "imperdibles" ? s.imperdible : s.categoria === current)).forEach((s) => {
        const c = el("article", "site"); const h = el("h3", null, s.nombre);
        c.append(h);
        const tags = el("div", "filters"); if (s.imperdible) tags.append(el("span", "tag must", "Imperdible")); if (s.categoria) tags.append(el("span", "tag", s.categoria)); c.append(tags);
        if (s.por_que) c.append(el("p", null, s.por_que));
        c.append(el("p", "meta", [s.zona && `📍 ${s.zona}`, s.tiempo && `⏱ ${s.tiempo}`, s.costo && `💲 ${s.costo}`].filter(Boolean).join(" · ")));
        const a = el("a", null, "Ver en Google Maps"); a.href = mapsSearch(`${s.nombre}, ${d}`); a.target = "_blank"; a.rel = "noopener"; c.append(a);
        grid.append(c);
      });
    };
    ["todos", "imperdibles", ...cats].forEach((k) => {
      const b = el("button", "chip", k === "todos" ? "Todos" : k === "imperdibles" ? "Imperdibles" : k[0].toUpperCase() + k.slice(1));
      b.type = "button"; b.setAttribute("aria-pressed", String(k === current));
      b.onclick = () => { current = k; filters.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); draw(); };
      filters.append(b);
    });
    body.append(filters, grid); draw();

    if (Array.isArray(r.donde_dormir) && r.donde_dormir.length) {
      body.append(el("h2", null, "Dónde dormir"));
      const ul = el("ul", "tips"); r.donde_dormir.forEach((z) => { const li = el("li"); li.append(el("strong", null, z.zona + ": "), document.createTextNode(`${z.por_que || ""}${z.rango_noche ? ` (${z.rango_noche} / noche)` : ""}`)); ul.append(li); }); body.append(ul);
    }
    if (Array.isArray(r.movilidad) && r.movilidad.length) {
      body.append(el("h2", null, "Cómo moverte"));
      const ul = el("ul", "tips"); r.movilidad.forEach((m) => ul.append(el("li", null, String(m)))); body.append(ul);
    }
    body.append(el("p", "notice", "Precios aproximados de Claude, sin consulta en vivo: verifica vuelos, tarifas y horarios antes de reservar."));
  }

  // ---------- Ejemplo inicial (no es tu viaje) ----------
  renderCar({
    via: "la Autopista del Café (ejemplo)", distancia_km: 300, tiempo_conduccion: "6 h 30 min", peajes: { cantidad: 6, total_aprox_cop: 110000, nota: "Ejemplo ilustrativo" },
    paradas: [
      { nombre: "Fusagasugá", municipio: "Cundinamarca", km: 64, tipo: "comida", por_que: "Buen punto para desayunar al bajar de la sabana.", tiempo_sugerido: "30 min", desvio: "sobre la vía" },
      { nombre: "Mirador de La Línea", municipio: "Cajamarca, Tolima", km: 215, tipo: "mirador", por_que: "Vista de la cordillera Central en el paso más alto.", tiempo_sugerido: "20 min", imperdible: true, desvio: "sobre la vía" },
      { nombre: "Filandia", municipio: "Quindío", km: 290, tipo: "pueblo", por_que: "Pueblo cafetero con mirador y calles de colores.", tiempo_sugerido: "1 h 30 min", imperdible: true, desvio: "20 min" },
    ],
    energia: ["Ejemplo: sal con batería al 100 % y tanque lleno.", "Ejemplo: en la bajada de La Línea el carro recupera batería frenando con el motor."],
  }, "Bogotá", "Salento (ejemplo)");
  $("head").prepend(el("p", "notice", "Así se ve un resultado (ejemplo). Escribe tu destino arriba para armar el tuyo."));

  // ---------- Markdown mínimo y seguro para las respuestas del chat ----------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inl = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  function md(src) {
    let html = "", list = false;
    for (const raw of src.split("\n")) {
      const t = raw.trim(); let m;
      if (!t) { if (list) { html += "</ul>"; list = false; } continue; }
      if ((m = t.match(/^#{1,4}\s+(.*)/))) { if (list) { html += "</ul>"; list = false; } html += `<h3>${inl(m[1])}</h3>`; continue; }
      if ((m = t.match(/^(?:[-*•]|\d+[.)])\s+(.*)/))) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inl(m[1])}</li>`; continue; }
      if (list) { html += "</ul>"; list = false; }
      html += `<p>${inl(t)}</p>`;
    }
    return html + (list ? "</ul>" : "");
  }

  // ---------- Llamadas ----------
  const msgFor = (code) => ({
    not_granted: "Para continuar, permite que esta página use Claude.",
    sampling_disabled: "Claude no está disponible para esta cuenta.",
    rate_limited: "Demasiadas solicitudes seguidas. Espera un momento y vuelve a intentar.",
    session_expired: "Tu sesión de Claude expiró. Vuelve a iniciar sesión.",
    refused: "Claude no pudo responder esa solicitud. Prueba a escribirla distinto.",
    invalid_json: "La respuesta llegó incompleta. Pulsa el botón otra vez.",
  }[code] || "Se cortó la conexión. Vuelve a intentar.");
  const showErr = (t) => { $("err").textContent = t; $("err").hidden = false; };
  const busy = (on) => { $("go").disabled = on; $("send").disabled = on; $("stop").hidden = !on; };

  async function plan() {
    $("err").hidden = true;
    const d = $("destino").value.trim();
    if (!d) { $("destino").focus(); showErr(mode === "carro" ? "Escribe hasta dónde vas." : "Escribe a dónde viajas."); return; }
    if (!sample) { showErr("Abre esta página dentro de Claude para usarla."); return; }
    const o = $("origen").value.trim() || "Bogotá";
    try { localStorage.setItem("ruta.origen", o); } catch {}
    const dias = $("dias").value.trim(), viaj = $("viajeros").value.trim() || "2", gustos = $("gustos").value.trim();
    const prompt = mode === "carro" ? carPrompt(o, d, dias, viaj, gustos) : airPrompt(o, d, dias, viaj, gustos);

    $("head").replaceChildren(el("div", "status", mode === "carro" ? `Buscando las mejores paradas de ${o} a ${d}… (≈ 1 min)` : `Armando presupuesto y sitios en ${d}… (≈ 1 min)`));
    $("body").replaceChildren(); $("chat").hidden = true; $("thread").replaceChildren();
    $("out").scrollIntoView({ behavior: "smooth", block: "start" });
    ctl = new AbortController(); busy(true);
    try {
      const r = await sample.json(prompt, { signal: ctl.signal, modelTier: "default" });
      if (!r || typeof r !== "object") throw { code: "invalid_json" };
      mode === "carro" ? renderCar(r, o, d) : renderAir(r, d);
      last = { mode, o, d, json: JSON.stringify(r) };
      turns = [];
      $("chat").hidden = false;
    } catch (e) {
      $("head").replaceChildren(); $("body").replaceChildren();
      if (e?.code !== "cancelled") showErr(msgFor(e?.code));
    } finally { busy(false); ctl = null; }
  }

  async function followup() {
    const q = $("followup").value.trim();
    if (!q || !last || !sample) return;
    $("followup").value = "";
    const th = $("thread");
    th.append(el("div", "you", q));
    const out = el("div", "md"), st = el("div", "status", "Pensando…");
    th.append(st, out);
    const ctx = `Eres un experto en viajes. Responde en español, breve y práctico (máx. 150 palabras, listas cortas, sin tablas). ${last.mode === "carro" ? "El carro es una Chery iCAR 03T de rango extendido (batería + generador a gasolina), no necesita parar a cargar." : ""}
Este es el plan que ya le diste al usuario (${last.mode}, ${last.o} → ${last.d}):
${last.json}`;
    turns.push({ role: "user", content: q });
    ctl = new AbortController(); busy(true);
    try {
      const { text } = await sample([{ role: "user", content: ctx }, ...turns], { signal: ctl.signal, cache: false, onText: ({ text }) => { st.remove(); out.innerHTML = md(text); } });
      st.remove(); out.innerHTML = md(text);
      turns.push({ role: "assistant", content: text });
      if (turns.length > 12) turns = turns.slice(-12);
    } catch (e) {
      st.remove(); turns.pop();
      if (e?.text) out.innerHTML = md(e.text); else out.remove();
      if (e?.code !== "cancelled") showErr(msgFor(e?.code));
    } finally { busy(false); ctl = null; }
  }

  $("go").onclick = plan;
  $("destino").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); plan(); } });
  $("send").onclick = followup;
  $("followup").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); followup(); } });
  $("stop").onclick = () => ctl?.abort();

  if (window.claude?.use) window.claude.use("sample").then((s) => { sample = s; if (!s) showErr("Abre esta página dentro de Claude para usarla."); });
  else showErr("Abre esta página dentro de Claude para usarla.");
})();
</script>
