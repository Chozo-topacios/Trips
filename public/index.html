<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ruta · Planificador de viajes</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">🧭 <strong>Ruta</strong> <span>planificador de viajes</span></div>
    <div class="top-actions">
      <button id="btn-vehiculo" class="ghost" title="Ajustar datos de la iCAR 03T">⚡ Mi vehículo</button>
      <button id="btn-nuevo" class="ghost">＋ Nuevo viaje</button>
    </div>
  </header>

  <main>
    <!-- Paso 1: tipo de viaje -->
    <section id="paso-modo" class="card center">
      <h1>¿El viaje es en carro o en avión?</h1>
      <div class="modos">
        <button class="modo" data-modo="carro">
          <span class="emoji">🚗</span>
          <strong>Carro</strong>
          <small>Ruta, peajes, energía iCAR 03T, paradas y hospedajes</small>
        </button>
        <button class="modo" data-modo="avion">
          <span class="emoji">✈️</span>
          <strong>Avión</strong>
          <small>Imperdibles, zonas para hospedarse, movilidad y presupuesto</small>
        </button>
      </div>
    </section>

    <!-- Paso 2: datos -->
    <section id="paso-datos" class="card hidden">
      <form id="form-carro" class="hidden">
        <h2>🚗 Viaje en carro</h2>
        <div class="grid">
          <label>Origen<input name="origen" required placeholder="Bogotá" /></label>
          <label>Destino<input name="destino" required placeholder="Medellín" /></label>
          <label>Fecha de salida<input name="fecha" type="date" /></label>
          <label>Días de viaje<input name="dias" type="number" min="1" value="3" /></label>
          <label>Viajeros<input name="viajeros" type="number" min="1" value="2" /></label>
          <label>Batería al salir (%)<input name="soc" type="number" min="5" max="100" value="100" /></label>
          <label>Presupuesto aprox.<input name="presupuesto" placeholder="COP 2.000.000" /></label>
          <label>¿Ida y vuelta?<select name="idavuelta"><option>Sí</option><option>No, solo ida</option></select></label>
        </div>
        <label>Intereses / preferencias<input name="intereses" placeholder="pueblos, naturaleza, gastronomía, hotel con cargador…" /></label>
        <div class="row"><button type="button" class="ghost volver">← Volver</button><button type="submit">Planear viaje</button></div>
      </form>

      <form id="form-avion" class="hidden">
        <h2>✈️ Viaje en avión</h2>
        <div class="grid">
          <label>Ciudad de salida<input name="origen" placeholder="Bogotá" /></label>
          <label>Destino<input name="destino" required placeholder="Cartagena" /></label>
          <label>Fecha de llegada<input name="fecha" type="date" /></label>
          <label>Días<input name="dias" type="number" min="1" value="4" required /></label>
          <label>Viajeros<input name="viajeros" type="number" min="1" value="2" /></label>
          <label>Presupuesto aprox.<input name="presupuesto" placeholder="USD 1.500" /></label>
        </div>
        <label>Intereses<input name="intereses" placeholder="historia, playa, comida, vida nocturna…" /></label>
        <div class="row"><button type="button" class="ghost volver">← Volver</button><button type="submit">Planear viaje</button></div>
      </form>
    </section>

    <!-- Paso 3: conversación -->
    <section id="chat" class="hidden">
      <div id="mensajes"></div>
      <form id="form-chat" class="composer">
        <textarea id="entrada" rows="1" placeholder="Pregunta o ajusta el plan… (ej. ‘evita peajes’ o ‘agrega un día en Guatapé’)"></textarea>
        <button type="submit" id="enviar">Enviar</button>
      </form>
    </section>
  </main>

  <dialog id="dlg-vehiculo">
    <form method="dialog" id="form-vehiculo">
      <h2>⚡ iCAR 03T</h2>
      <p class="muted">Valores de referencia; ajústalos a la ficha técnica de tu versión.</p>
      <div class="grid">
        <label>Batería útil (kWh)<input name="bateria_kwh" type="number" step="0.1" /></label>
        <label>Consumo (kWh/100 km)<input name="consumo_kwh_100km" type="number" step="0.1" /></label>
        <label>Carga DC máx. (kW)<input name="carga_dc_max_kw" type="number" /></label>
        <label>Carga AC (kW)<input name="carga_ac_kw" type="number" step="0.1" /></label>
      </div>
      <div class="row"><button value="cancel" class="ghost">Cancelar</button><button value="ok">Guardar</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
